series_id: cinematic_narrative
# Vertical, with framing_intent 0.0 below - the letterbox bars are
# the look, not an accident of the source frame.
# library/tools/delivery_format.py.
delivery_format: vertical_1080x1920
style:
  energy_profile: calm
  framing_intent: 0.0  # full letterbox - cinematic bars are part of the look
  # No pacing block - see docs/PIPELINE_PLAN.md P4.2.
  color_palette: ["#223344", "#aabbcc", "#111111"]
  # NO LOOK IS DECLARED, and that is deliberate.
  #
  # This template used to name `warm_reflection`, one of four looks the engine
  # shipped. Their strengths - a glow gain, a grain power, a vignette
  # blend, a slope triple - were numbers this repository authored, not
  # numbers anyone chose for a series. The captain, 2026-08-28: "i want
  # no hardcoded values. there are no house glow looks, there are no
  # settled house grain or anything." So the catalogue is gone and its
  # numbers were NOT moved in here.
  #
  # The DIRECTION this series' planning document states is kept, because
  # it is the captain's and it is what a future declaration has to
  # deliver: warm amber highlights, warm shadows that never go blue,
  # medium-high contrast, and a falloff into a warm dark rather than
  # neutral black (1_through_the_4th_wall and 3_prestige,
  # 'Colour Grading'). NOTE: this template's palette is cool blue-grey
  # and that direction is warm; reconcile them when the series
  # identity is decided.
  #
  # To grade under this template, declare the values:
  # `python3 -c "from library.tools.house_look import
  #  describe_declaration_shape as d; print(d())"`
  # Add path to reference frame for AI color matching here:
  # reference_look_image: "/path/to/reference.jpg"
effect:
  # dissolve/wipe are not deliverable - see transition_vocabulary.py
  transition_types: ["hard_cut", "match_cut", "fade_to_black", "defocus"]
  vfx_intensity: 0.3
  subtitle_style: "minimal"
  # NO motion accents, and this is NOT an oversight - do not "fix" it by
  # adding motion_accents: true.
  #
  # This template CANNOT carry them. Its palette is
  # ["#223344", "#aabbcc", "#111111"], and the most saturated entry is a
  # dark muted navy that would sit almost on top of its own near-black
  # outline and read as a smudge rather than as an accent. The rule in
  # library/tools/brand_palette.py rejects it, so enabling accents here
  # raises MissingAccentColor rather than silently drawing something
  # unreadable. The choice was made by the palette, not by taste.
  #
  # Give this template a palette entry that would survive against its own
  # outline first, and the accents become available. Corner brackets also
  # fight a letterboxed cinematic frame, which is the same reason its
  # subtitle style is the quiet one.
  # Guarded by tests/test_motion_graphics_template.py.
  sfx_density: moderate
  caption_case: lowercase
content:
  music_genre: ["orchestral", "atmospheric"]
  target_duration_seconds:
    min: 180
    max: 600
