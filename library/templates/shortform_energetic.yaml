series_id: shortform_energetic
style:
  energy_profile: high
  pacing:
    cuts_per_minute_min: 15
    cuts_per_minute_max: 25
  color_palette: ["#ff0055", "#00ffcc", "#ffffff", "#000000"]
  # No preferred_powergrade. This named "High Contrast Pop", and
  # library/presets/powergrades/high_contrast_pop.drx does not exist.
  # step_5_01_color_grade still puts the unresolved path in the manifest so
  # the renderer fails loudly, so every run under this template died with
  # FileNotFoundError at the PowerGrade apply in resolve_build_timeline.
  # Re-add this line when a real .drx of that name ships.
effect:
  # zoom/glitch never existed as renderer types - see transition_vocabulary.py
  transition_types: ["hard_cut", "jump_cut", "zoom_blur", "flash"]
  vfx_intensity: 0.8
  subtitle_style: "bold_large"
  sfx_density: dense
  caption_case: lowercase
content:
  music_genre: ["electronic", "upbeat"]
  target_duration_seconds:
    min: 30
    max: 60
