series_id: shortform_energetic
# Reels / Shorts / TikTok. See library/tools/delivery_format.py.
delivery_format: vertical_1080x1920
style:
  energy_profile: high
  framing_intent: 1.0  # always fill - no black bars for punchy content
  # No pacing block. It used to declare cuts_per_minute_min/max, which
  # nothing in the repository read - see docs/PIPELINE_PLAN.md P4.2.
  color_palette: ["#ff0055", "#00ffcc", "#ffffff", "#000000"]
  # NO LOOK IS DECLARED, and that is deliberate.
  #
  # This template used to name `electric_contrast`, one of four looks the engine
  # shipped. Their strengths - a glow gain, a grain power, a vignette
  # blend, a slope triple - were numbers this repository authored, not
  # numbers anyone chose for a series. The captain, 2026-08-28: "i want
  # no hardcoded values. there are no house glow looks, there are no
  # settled house grain or anything." So the catalogue is gone and its
  # numbers were NOT moved in here.
  #
  # The DIRECTION this series' planning document states is kept, because
  # it is the captain's and it is what a future declaration has to
  # deliver: contrast pushed hard; deep, inky blacks; full saturation; slight
  # bloom on highlights; explicitly NOT desaturated, NOT a cool overall
  # temperature, NOT flat, NOT orange-and-teal (2_pr_or_er and
  # 5_sidequests, 'Colour Grading'). The accent colour lives in the
  # overlays, not in the grade.
  #
  # To grade under this template, declare the values:
  # `python3 -c "from library.tools.house_look import
  #  describe_declaration_shape as d; print(d())"`
effect:
  # zoom/glitch never existed as renderer types - see transition_vocabulary.py
  transition_types: ["hard_cut", "jump_cut", "zoom_blur", "flash"]
  vfx_intensity: 0.8
  subtitle_style: "bold_large"
  # Motion graphics (Q3, 2026-08-16). Accents are declared per template,
  # never defaulted - a template that says nothing gets nothing. This one
  # says yes to both: high energy, dense SFX, and the corner brackets are
  # drawn in this palette's #ff0055 rather than the withdrawn stock cyan.
  motion_accents: true
  motion_progress_bar: true
  sfx_density: dense
  caption_case: lowercase
content:
  music_genre: ["electronic", "upbeat"]
  target_duration_seconds:
    min: 30
    max: 60
