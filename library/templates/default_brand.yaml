series_id: "default_series"
style:
  color_palette:
    - "#ff0000"
    - "#00ff00"
    - "#0000ff"
  # No preferred_powergrade: library/presets/powergrades/default.drx is a
  # placeholder text file, not a real DaVinci .drx, and pointing at it
  # made the pipeline look configured for a grade it could never apply.
  # Set this to a real .drx to turn the PowerGrade path on.
  typography:
    font: "Helvetica"
    size: 42
    weight: "bold"
  pacing:
    min_cuts_per_minute: 10
    max_cuts_per_minute: 20
  energy_profile: "high"
effect:
  # Must be types from library/tools/transition_vocabulary.py - anything
  # else is rejected with a warning rather than silently ignored.
  # "dissolve" and "wipe" were listed here and are NOT deliverable: both
  # need the outgoing and incoming clips mixed in one composition, which
  # the per-clip Fusion route cannot do. The gap is real, not narrowed
  # away; see WITHDRAWN in that module for the full reasoning.
  transition_types:
    - "hard_cut"
    - "jump_cut"
    - "match_cut"
    - "fade_to_black"
    - "defocus"
    - "flash"
    - "zoom_blur"
  transition_duration_ms:
    min: 200
    max: 500
  vfx_intensity: 0.5
  subtitle_style: "default_subtitles"
  sfx_density: "dense"
  caption_case: "lowercase"
content:
  series_title: "Default Series"
  channel_name: "Default Channel"
  intro_template: "library/presets/fusion-macros/intro_lower_third.setting"
  outro_template: "library/presets/fusion-macros/outro_subscribe.setting"
  watermark:
    image: "library/assets/watermark.png"
    position: "bottom-right"
  music_genre:
    - "electronic"
    - "upbeat"
  target_duration_seconds:
    min: 30
    max: 60
