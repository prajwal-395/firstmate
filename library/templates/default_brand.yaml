series_id: "default_series"
# The frame this series ships in (captain's ruling, 2026-08-19).
# Declared explicitly even though it IS the default, because this is
# the template a project with no template of its own falls back to -
# and a project 001 that quietly shipped 1920x1080 is exactly what
# the ruling exists to stop. See library/tools/delivery_format.py.
delivery_format: vertical_1080x1920
style:
  # A real NEUTRAL palette, not a placeholder. This template is the
  # fallback a project gets when project.yaml names no brand template, so
  # its job is to render something legible rather than to express a brand.
  #
  # It used to be three pure RGB primaries, which was visibly placeholder
  # data - and once colour started coming from the palette (P3.1/P3.2) it
  # stopped being harmless: the motion-graphics upper third rendered its
  # subtitle line in #ff0000. See docs/PIPELINE_PLAN.md.
  #
  # Deliberately carries NO accent: every entry is below the saturation
  # floor in library/tools/brand_palette.py, so nothing here can be
  # mistaken for a brand colour. A fallback should not invent one.
  color_palette:
    - "#F5F5F5"  # text - near-white, reads over most footage
    - "#9AA0A6"  # mid neutral
    - "#141414"  # outline - near-black
  # The channel's neutral state: warm-leaning, rich, no series accent.
  # See library/tools/house_look.py.
  house_look: pmk_default
  # Agrees with `default_subtitles` in library/tools/subtitle_style.py
  # rather than fighting it. A template's typography legitimately
  # overrides the named style's shape - that is what a brand template is
  # for - so a value left here that disagrees SILENTLY wins.
  #
  # This block said Helvetica/42/bold, and no frame was ever rendered
  # from it: before the template load was wired up (#131) it reached no
  # step at all. 42 was sized for the layout where the picture sat in a
  # 608-row band with black above and below, which #133 removed; against
  # a full 1920 it is 2.2% of frame height, SMALLER than the 3% it was
  # meant to replace. Montserrat/160/800 is what #135 authored for
  # `default_subtitles` and what every build has actually rendered.
  typography:
    font: "Montserrat"
    size: 160
    weight: 800
  # No pacing block. It used to declare min_cuts_per_minute /
  # max_cuts_per_minute - a third spelling of a key nothing read.
  # See docs/PIPELINE_PLAN.md P4.2.
  energy_profile: "high"
effect:
  # Must be types from library/tools/transition_vocabulary.py - anything
  # else is rejected with a warning rather than silently ignored.
  # "dissolve" and "wipe" were listed here and are NOT deliverable: both
  # need the outgoing and incoming clips mixed in one composition, which
  # the per-clip Fusion route cannot do. The gap is real, not narrowed
  # away; see WITHDRAWN in that module for the full reasoning.
  transition_types:
    - "hard_cut"
    - "jump_cut"
    - "match_cut"
    - "fade_to_black"
    - "defocus"
    - "flash"
    - "zoom_blur"
  transition_duration_ms:
    min: 200
    max: 500
  vfx_intensity: 0.5
  subtitle_style: "default_subtitles"
  # No motion accents. This is the FALLBACK template, not a shipped look,
  # and its color_palette is three pure RGB primaries that are visibly a
  # placeholder - accents here would render as #ff0000 corner brackets.
  # See docs/PIPELINE_PLAN.md: a fallback template that renders is not the
  # same as one anyone should ship.
  sfx_density: "dense"
  caption_case: "lowercase"
content:
  series_title: "Default Series"
  channel_name: "Default Channel"
  # No bookends. The fallback template gets no intro, no outro and no end
  # card, which is what "nothing by default" means (Q7, 2026-08-16). It
  # used to name two Fusion .setting macros - a full-frame pure red slate
  # and a "Subscribe!" card the channel spec forbids by name - that no
  # step ever imported. Both are deleted; see library/tools/bookends.py
  # for what a template that DOES want a card declares.
  music_genre:
    - "electronic"
    - "upbeat"
  target_duration_seconds:
    min: 30
    max: 60
