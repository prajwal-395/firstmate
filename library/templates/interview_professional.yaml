series_id: interview_professional
# Still shortform: this template is the talking-head cut of a
# vertical series, not a 16:9 long-form interview.
# library/tools/delivery_format.py.
delivery_format: vertical_1080x1920
style:
  energy_profile: moderate
  # No pacing block - see docs/PIPELINE_PLAN.md P4.2.
  color_palette: ["#f5f5f5", "#333333", "#ddab7e"]
  # NO LOOK IS DECLARED, and that is deliberate.
  #
  # This template used to name `film_stock_warmth`, one of four looks the engine
  # shipped. Their strengths - a glow gain, a grain power, a vignette
  # blend, a slope triple - were numbers this repository authored, not
  # numbers anyone chose for a series. The captain, 2026-08-28: "i want
  # no hardcoded values. there are no house glow looks, there are no
  # settled house grain or anything." So the catalogue is gone and its
  # numbers were NOT moved in here.
  #
  # The DIRECTION this series' planning document states is kept, because
  # it is the captain's and it is what a future declaration has to
  # deliver: warm-neutral temperature; highlights pushed to cream; warm,
  # slightly lifted shadows with visible detail; muted but not
  # desaturated; medium contrast; visible grain (8_moneyball,
  # 'Colour Grading - The Film Grade').
  #
  # To grade under this template, declare the values:
  # `python3 -c "from library.tools.house_look import
  #  describe_declaration_shape as d; print(d())"`
effect:
  # dissolve is not deliverable - see transition_vocabulary.py
  transition_types: ["hard_cut", "jump_cut", "defocus"]
  vfx_intensity: 0.1
  subtitle_style: "clean_standard"
  # Brackets yes, progress bar no. The warm #ddab7e reads as editorial
  # rather than as a stock template, but a progress bar is a shortform
  # retention device and cheapens a talking-head interview.
  motion_accents: true
  motion_progress_bar: false
  sfx_density: sparse
  caption_case: lowercase
content:
  music_genre: ["ambient", "acoustic"]
  target_duration_seconds:
    min: 300
    max: 900
