# Lucie Content - client brand template.
#
# The engine is the captain's junior editor for the 8 planned series AND
# for client work (decision record 2026-08-17, "junior editor scope"), so
# a client's premade cards are a first-class template declaration rather
# than a script somebody remembers to run.
#
# This is the one template that declares content.bookends, which is the
# whole point of Q7 (2026-08-16): the mechanism is general, and nothing
# gets a card unless it asks for one.
#
# The two compositions are the client's own work and live with the client's
# project, not in this repo. `source` is resolved against the project
# folder, so a project using this template needs:
#
#   <project>/compositions/LucieLogoAnimation.tsx
#   <project>/compositions/LucieEndCard.tsx
#   <project>/compositions/lucie-logo.png   (any sibling asset the .tsx
#                                            reaches for with staticFile)
#
# library/tools/bookend_render.py stages those verbatim and renders them.
# Nothing here edits them: they are the client's brand, and props carry
# the copy so the file never has to be touched to change a line of it.
series_id: lucie_client
# library/tools/delivery_format.py.
delivery_format: vertical_1080x1920
style:
  # Lucie's brand colours: deep navy ground, amber accent, near-white text.
  color_palette: ["#FFAA4D", "#F5F5F5", "#253746"]
  house_look: pmk_default
  typography:
    font: "Montserrat"
    size: 42
    weight: "bold"
  energy_profile: moderate
effect:
  transition_types: ["hard_cut", "fade_to_black", "defocus"]
  transition_duration_ms:
    min: 200
    max: 500
  vfx_intensity: 0.2
  subtitle_style: "default_subtitles"
  sfx_density: sparse
  caption_case: as_written
content:
  channel_name: "Lucie Content"
  bookends:
    intro:
      composition: LucieLogoAnimation
      source: compositions/LucieLogoAnimation.tsx
      duration_seconds: 3.0
      props:
        accentColor: "#FFAA4D"
        style: full
    end_card:
      composition: LucieEndCard
      source: compositions/LucieEndCard.tsx
      duration_seconds: 5.0
      props:
        headline: "We power what AI knows about you."
        tagline: "Strategic storytelling built for human trust and AI visibility."
        websiteUrl: "luciecontent.com"
        accentColor: "#FFAA4D"
        bgColor: "#253746"
  music_genre: ["ambient", "corporate"]
  target_duration_seconds:
    min: 30
    max: 90
