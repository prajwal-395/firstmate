# Through the 4th Wall - series brand template.
#
# This template declares NO text overlay.  It used to carry an
# `effect.timed_text_overlay` block - a night card plus a closing "end
# card" ritual - lifted verbatim from a previous manual trial run of the
# series, whose .tsx still lives in the 4th-wall project folder.  The
# captain removed it on 2026-08-20: "it was something made in a previous
# trial run and is a pretty shoddy asset, so lets just get rid of it".
#
# The pattern was never the problem - N timed text moments with per-item
# colour, size, start frame and fade is a general engine component, and
# all eight series want intro cards and episode text.  What went wrong is
# that one episode's finished artwork was checked into the engine as a
# series DEFAULT: absolute frame numbers baked to that run's 1800-frame
# (60.000s) timeline, normalised y positions authored against a
# full-bleed vertical frame, and an unbundled typeface.  See
# docs/ASSET_LIBRARY_PLAN.md for the general-vs-project test that keeps
# the next one out.
series_id: fourth_wall
# A <=60s vertical monologue - see the series planning docs.
# library/tools/delivery_format.py.
delivery_format: vertical_1080x1920
style:
  energy_profile: calm
  color_palette: ["#D4A34A", "#00BFFF", "#FFFFFF", "#111111"]
  # The same warm-reflection look as cinematic_narrative - the 4th Wall
  # is a night-time series and warm amber / warm shadows match its tone.
  house_look: warm_reflection
effect:
  transition_types: ["hard_cut", "fade_to_black", "defocus"]
  vfx_intensity: 0.3
  subtitle_style: "minimal"
  sfx_density: sparse
  caption_case: lowercase
content:
  music_genre: ["ambient", "lo-fi"]
  target_duration_seconds:
    min: 45
    max: 90
