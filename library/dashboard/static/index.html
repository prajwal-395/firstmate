<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Review Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <rect x="2" y="3" width="20" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M10 8l5 4-5 4V8z" fill="currentColor"/>
                    </svg>
                    <span>Review Dashboard</span>
                </div>
                <div class="project-selector" style="margin-top: 12px;">
                    <select id="project-select" onchange="switchProject(this.value)" class="project-dropdown" style="width: 100%; padding: 6px; background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-primary); border-radius: 4px;">
                        <option value="">Loading projects...</option>
                    </select>
                </div>
            </div>

            <div class="nav-section">
                <div class="nav-label">Views</div>
                <button class="nav-item active" data-view="pipeline" onclick="navigate('pipeline')">
                    <span class="nav-icon">&#9654;</span> Pipeline
                </button>
                <button class="nav-item" data-view="messages" onclick="navigate('messages')">
                    <span class="nav-icon">&#128233;</span> Messages
                    <span id="messages-badge" class="nav-badge" style="display: none">0</span>
                </button>
                <button class="nav-item" data-view="footage" onclick="navigate('footage')">
                    <span class="nav-icon">&#127909;</span> Footage Library
                </button>
                <button class="nav-item" data-view="transcript" onclick="navigate('transcript')">
                    <span class="nav-icon">&#128196;</span> Transcript
                </button>
                <button class="nav-item" data-view="timeline" onclick="navigate('timeline')">
                    <span class="nav-icon">&#9776;</span> Timeline
                </button>
            </div>

            <div class="nav-section">
                <div class="nav-label">Status</div>
                <div id="sidebar-status" class="sidebar-status">
                    <div class="status-row">
                        <span class="status-dot completed"></span>
                        <span id="completed-count">0</span> completed
                    </div>
                    <div class="status-row">
                        <span class="status-dot gate-pending"></span>
                        <span id="gate-count">0</span> pending review
                    </div>
                    <div class="status-row">
                        <span class="status-dot pending"></span>
                        <span id="pending-count">0</span> pending
                    </div>
                    <div class="status-row">
                        <span class="status-dot failed"></span>
                        <span id="failed-count">0</span> failed
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main content area -->
        <main id="main-content">
            <!-- Top bar -->
            <header id="topbar">
                <div id="breadcrumb" class="breadcrumb">Pipeline Overview</div>
                <div class="topbar-actions">
                    <button id="pipeline-start-btn" class="btn btn-primary" onclick="startPipeline()">&#9654; Start</button>
                    <button id="pipeline-resume-btn" class="btn btn-primary" onclick="resumePipeline()">&#9654; Resume</button>
                    <button id="pipeline-pause-btn" class="btn btn-reject" onclick="pausePipeline()">&#10074;&#10074; Pause</button>
                    <button id="refresh-btn" class="btn btn-ghost" onclick="refreshData()">
                        &#8635; Refresh
                    </button>
                </div>
            </header>

            <!-- Content views (one visible at a time) -->
            <div id="view-pipeline" class="view active">
                <div id="pipeline-content" class="pipeline-grid"></div>
            </div>

            <div id="view-messages" class="view">
                <div id="messages-content" class="messages-container"></div>
            </div>

            <div id="view-footage" class="view">
                <div id="footage-content"></div>
            </div>

            <div id="view-transcript" class="view">
                <div id="transcript-content" class="transcript-container"></div>
            </div>

            <div id="view-timeline" class="view">
                <div id="timeline-content" class="timeline-container"></div>
            </div>

            <div id="view-step-detail" class="view">
                <div id="step-detail-content" class="step-detail-container"></div>
            </div>
        </main>

        <!-- Inspector panel (right side, shown when inspecting a step) -->
        <aside id="inspector" class="inspector hidden">
            <div class="inspector-header">
                <h3 id="inspector-title">Step Inspector</h3>
                <button class="btn btn-ghost" onclick="closeInspector()">&#10005;</button>
            </div>
            <div id="inspector-content" class="inspector-body"></div>
        </aside>
    </div>

    <!-- Gate action modal -->
    <div id="gate-modal" class="modal hidden">
        <div class="modal-overlay" onclick="closeGateModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="gate-modal-title">Review Gate</h3>
                <button class="btn btn-ghost" onclick="closeGateModal()">&#10005;</button>
            </div>
            <div id="gate-modal-body" class="modal-body"></div>
            <div class="modal-actions">
                <button class="btn btn-approve" onclick="submitGateAction('approve')">
                    &#10003; Approve
                </button>
                <button class="btn btn-revise" onclick="submitGateAction('revise')">
                    &#9998; Revise
                </button>
                <button class="btn btn-reject" onclick="submitGateAction('reject')">
                    &#10007; Reject
                </button>
            </div>
            <div class="modal-feedback">
                <label>Feedback / Notes</label>
                <textarea id="gate-feedback" placeholder="Add feedback, revision notes, or context for the LLM..."></textarea>
            </div>
            <div id="gate-revisions" class="modal-revisions hidden">
                <label>Revisions (JSON)</label>
                <textarea id="gate-revisions-json" placeholder='{"field_name": "new_value"}'></textarea>
            </div>
        </div>
    </div>

    <script src="/static/components/pipeline-view.js"></script>
    <script src="/static/components/json-viewer.js"></script>
    <script src="/static/components/step-inspector.js"></script>
    <script src="/static/components/transcript-view.js"></script>
    <script src="/static/components/footage-library.js"></script>
    <script src="/static/components/timeline-view.js"></script>
    <script src="/static/components/gate-controls.js"></script>
    <script src="/static/components/message-feed.js"></script>
    <script src="/static/components/review-channel.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
