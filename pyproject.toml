[tool.pytest.ini_options]
# Every test root in the repository.  `pytest` (no args) collects from
# all of them; `pytest tests/` - which CI currently runs - sees only the
# first.  When the workflow file is unparked (September 2026), change the
# CI command from `python -m pytest tests/` to `python -m pytest` so it
# honours this list.
#
# tests/test_no_orphan_test_files.py fails when a test_*.py exists
# outside these roots, so a new directory cannot slip in unnoticed.
testpaths = [
    "tests",
    "library/tools/fusion/tests",
]
markers = [
    "heavy_ml: marks tests that require heavy ml dependencies like parselmouth",
    "heavy: marks tests whose worst observed duration across repeated full-suite runs is >= 1.0s (docs/HEAVY_TIER.md) - the slow tier the default lane deselects; NOT optional, the batch gate runs it before anything merges",
    "serial: marks tests that must run in the gate's serial lane (library/tools/lane_routing.py clause 6); takes a reason",
]

# ─── Ren, the installed front door (README "Quickstart") ─────────────
#
# Installed EDITABLE into the shared 3.12 venv (docs/SHARED_ENVIRONMENT.md):
#     uv pip install --python ~/.local/share/vep/venv-py312/bin/python3 -e .
# Only the small `ren` package is installed; it finds the engine - this
# checkout - beside itself, so `library/` is never shadowed in site-packages.
#
# Dependencies come in groups, one flat file each under requirements/
# (library/tools/dependency_groups.py). A bare install takes `core`; name
# the capabilities you want: `pip install -e '.[analysis,identity]'`, or
# `.[all]` for every runtime group. `.[dev]` is the test gate.
# `pip install -r requirements.txt` still installs everything.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ren"
version = "0.1.0"
description = "Ren: an agent-driven video editor on DaVinci Resolve Studio"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
ren = "ren.cli:main"
ren-marker-hook = "ren.hooks.marker_hook:main"
ren-setup-hooks = "ren.setup_hooks:main"

[tool.setuptools]
packages = ["ren", "ren.hooks"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements/core.txt"] }

# Each package is declared in ONE group file; an extra that needs another
# group lists that file too, so no floor is stated twice. Resolve's own
# scripting module ships with Resolve Studio - what a reel build needs from
# pip is graphics (the Haar punch-in, frame tools).
[tool.setuptools.dynamic.optional-dependencies]
graphics = { file = ["requirements/graphics.txt"] }
resolve = { file = ["requirements/graphics.txt"] }
analysis = { file = ["requirements/analysis.txt", "requirements/graphics.txt"] }
identity = { file = ["requirements/identity.txt", "requirements/graphics.txt"] }
all = { file = ["requirements/graphics.txt", "requirements/analysis.txt", "requirements/identity.txt"] }
dev = { file = ["requirements/dev.txt"] }
