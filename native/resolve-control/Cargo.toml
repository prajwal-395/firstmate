[package]
name = "resolve-control"
version = "0.1.0"
edition = "2021"
description = "Native macOS driver for DaVinci Resolve: AX, CGEvent, ScreenCaptureKit, Vision OCR"
publish = false

[[bin]]
name = "resolve-control"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"
