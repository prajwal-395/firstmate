# `ren`: the native front door an engine tree ships at `bin/ren`.
#
# The crate version is deliberately NOT a version statement about Ren:
# `ren/version.py` is the one source of the product's version, and this
# crate never reports one - it execs the Python implementation, which
# prints the real build.
[package]
name = "ren-cli"
version = "0.0.0"
edition = "2021"
description = "Ren's native front door: resolves the engine, serves the file-reading verbs natively, and execs the Python implementation for the rest"
publish = false

[[bin]]
name = "ren"
path = "src/main.rs"

[[bin]]
name = "ml-worker-client"
path = "src/bin/ml_worker_client.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ren-protocol = { path = "../ren-protocol" }
