[package]
name = "ren-graphics-fframes"
version = "0.1.0"
edition = "2024"
description = "Ren's precompiled FFrames graphics renderer"
license = "MIT"

[[bin]]
name = "ren-graphics-fframes"
path = "src/main.rs"

[dependencies]
fframes = { version = "1.2.0", features = ["cpu_renderer", "compile-time-svgtree"] }
fframes_skia_renderer = { version = "1.2.0", features = ["metal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fontdb = "0.16"
ttf-parser = "0.20"
base64 = "0.22"
