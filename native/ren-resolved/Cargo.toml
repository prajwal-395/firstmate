[package]
name = "ren-resolved"
version = "0.1.0"
edition = "2021"
description = "The ren-resolved daemon in Rust: the broker, scheduler, watchdog and job store behind the one Resolve instance"
publish = false

[[bin]]
name = "ren-resolved"
path = "src/main.rs"

[dependencies]
ren-protocol = { path = "../ren-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
