# Through the 4th Wall - the Night card, as a project declares it.
#
# This is a PROJECT asset that happens to live in tests/fixtures/ so that
# tests/test_night_card_delivery.py can render it. Its home is the
# episode's own folder:
#
#     <projects root>/4th-wall/<episode>/project.yaml
#
# and nothing about it belongs in library/templates/. The copy below is
# artwork - the series' name and its nocturnal episode numbering - and
# docs/ASSET_LIBRARY_PLAN.md section 3 (ratified 2026-08-20) puts artwork
# with the project. The engine reads it through
# library/tools/timed_text_overlay.resolve_declaration, which lets the
# project's `effect.timed_text_overlay` win over the brand template's.
#
# Design source (READ ONLY, outside this repo):
#   PLAN/series portfolio '26 planning/1_through_the_4th_wall/
#     branding_creative_direction.md
#   - "The Night card ('Night 47 - Through the 4th Wall') appears AFTER
#     the cold open line - it contextualizes without interrupting. The
#     hook comes first, the branding comes second."  (line 142)
#   - Faded Brass #D4A34A: "'Night 47' text, small supporting labels,
#     secondary type"                                 (line 83)
#   - Ice Blue #00BFFF: "Series name, title cards"    (line 84)
#   - Nanum Pen Script, locked, single typeface for the whole series
#                                                     (lines 227, 344)
#   - Intro cards are 2-3 seconds max
#     (overall_branding_creative_direction.md line 245)
name: "Night 1"
slug: "night-001"
client: "4th-wall"
status: draft

source:
  type: iphone_mov
  resolution: 1080x1920
  fps: 30

pipeline:
  # Vertical 1080x1920 by default; stated so the card's geometry below is
  # readable next to the frame it was authored against.
  delivery_format: vertical_1080x1920

resolve:
  project_name: "4th Wall - Night 1"
  timeline_name: "Main Edit"

effect:
  timed_text_overlay:
    # The series' locked typeface. It is NOT bundled in the engine and
    # must not be (captain's ruling, 2026-08-20: per-series typefaces live
    # per project with their licences). The file and its OFL text belong
    # in this project's brand_assets/, from where prep_remotion stages it
    # into Remotion's public/brand/. Declaring the family without the file
    # now raises rather than substituting - library/tools/render_fonts.py.
    font_family: "Nanum Pen Script"
    font_file: "NanumPenScript-Regular.ttf"
    moments:
      # TIMING. Anchored to the END of the hook block, which is the cold
      # open line, so the card lands where the creative direction puts it
      # in an edit of any length. No absolute frames and no assumed total:
      # that is what the removed end card got wrong, with moments baked to
      # a 60.000s cut that landed 2.63s and 4.13s past the end of the
      # 54.869s render on disk.
      #
      # GEOMETRY. y is normalised against the WHOLE delivery frame, not
      # the picture inside the letterbox bars. Measured on the render the
      # pipeline actually produces (project 001, Pipeline_Edit.mp4,
      # 1080x1920, 16:9 landscape source): the picture occupies rows
      # 656..1263 and the burnt-in captions rows ~1699..1765. Both moments
      # sit in the lower third of that band - over picture whether the
      # source is letterboxed or full-bleed, clear of the captions, and
      # below the speaker's face rather than across it.
      - text: "Night 1"
        color: "#D4A34A"          # Faded Brass - episode label
        font_size: 72
        font_weight: 400
        block: hook
        anchor: end
        offset_seconds: 0.15
        duration_seconds: 2.0
        x: 0.5
        y: 0.545                  # row 1046 of 1920
        fade_in_frames: 9
        fade_out_frames: 12
        # Deep Espresso #120B07, the series' warm black. Two layers: a
        # tight edge so the glyphs keep their shape, and a soft halo so
        # brass type holds against a bright frame as well as an
        # amber-graded one.
        text_shadow: "0px 2px 6px rgba(18,11,7,0.9), 0px 0px 24px rgba(18,11,7,0.6)"
      - text: "Through the 4th Wall"
        color: "#00BFFF"          # Ice Blue - the series name
        font_size: 52
        font_weight: 400
        block: hook
        anchor: end
        offset_seconds: 0.45      # lands after the label, one card
        duration_seconds: 1.7
        x: 0.5
        y: 0.605                  # row 1162 of 1920
        fade_in_frames: 9
        fade_out_frames: 12
        text_shadow: "0px 2px 6px rgba(18,11,7,0.9), 0px 0px 24px rgba(18,11,7,0.6)"
