# The half of CI's style check that CAN FAIL THE BUILD.
#
# Until this file existed, `.github/workflows/ci.yml` ran
#
#     ruff check library/ tests/ --output-format=github || true
#
# and the trailing clause swallowed the exit code.  Run 33667912850
# emitted 2,896 error annotations and concluded SUCCESS.  That is the
# shape AGENTS.md 10.4 names - a gate that cannot fail is worse than no
# gate, because it reads as coverage.
#
# Deleting `|| true` outright would have pushed ~2,900 findings into a
# red build and blocked every PR, so the check is STAGED instead, in two
# ruff invocations:
#
#   1. THIS config, run WITHOUT `|| true`.  It selects only the rule
#      classes that indicate a real defect, and it fails the build.
#   2. The unfiltered `ruff check library/ tests/ ... || true`, which
#      still annotates every cosmetic finding and still cannot fail.
#
# The two run under DIFFERENT configs on purpose: the grandfathering
# below is invisible to the reporting half, so a deferred finding is
# still annotated on every PR rather than disappearing behind the gate.
#
# HOW TO CHANGE IT
#
#   Promoting a rule class:  add it to `select`, run
#   `ruff check library/ tests/ --config ruff-ci-gate.toml`, and either
#   fix what it finds or record the files under `per-file-ignores` with
#   the count, as below.  Never add a class silently ignored everywhere.
#
#   Fixing a grandfathered file:  delete its line.  A line that is no
#   longer needed is a lie about what this repository still owes.
#
# WHAT THIS IS NOT
#
#   It is not the project's lint configuration.  Nothing outside CI reads
#   it; `ruff check` with no `--config` still sees every rule, which is
#   what a developer running ruff locally should get.

[lint]

# ── Enforced, and clean today ─────────────────────────────────────────
#
# Every rule below finds NOTHING in `library/` or `tests/` as of this
# commit, so it is enforced with no exceptions at all: the first thing
# each one fails on will be new.  They were chosen on one test - does a
# hit mean the code is WRONG, rather than untidy.
select = [
    # pyflakes: names that do not resolve, or resolve twice
    "F502", "F506", "F601", "F632", "F701", "F702", "F811", "F821", "F823",
    # pycodestyle: comparisons and handlers that do not do what they read as
    "E713", "E714", "E721", "E722", "E902",
    # flake8-bugbear: the defect half, not the style half
    "B002", "B004", "B006", "B008", "B015", "B018", "B020", "B023",
    "B026", "B032", "B033",
    # pylint errors, and the warnings that are really errors
    "PLE",
    "PLW0127", "PLW0128", "PLW0129", "PLW0131", "PLW0133",
    "PLW0602", "PLW1509", "PLW1510",
    # bandit: the two that execute or trust something
    "S307", "S506",
    # ruff's own: a discarded handle, a mutable class default
    "RUF006", "RUF008", "RUF009", "RUF017",
    # asyncio: a call that blocks the loop
    "ASYNC100",
]

# ── Enforced, with the existing occurrences RECORDED ──────────────────
#
# 107 findings across 64 files, deferred by FILE with the count stated.
# This is a staged path and it is weaker than it looks in one specific
# way, said plainly rather than left to be discovered: a file listed here
# is exempt from that rule ENTIRELY, so a NEW `subprocess.run` with no
# `check=` added to `library/tools/render_qa.py` still passes.  A new one
# in any of the ~500 files NOT listed does not.
#
# The counts, from `ruff check library/ tests/ --select PLW1510,B023,F811
# --statistics` at commit 2abbdff:
#
#   PLW1510  subprocess-run-without-check   108   (57 in library/, 51 in tests/)
#
# One of the 108 has since been FIXED rather than moved:
# `step_5_01_color_grade/step.py` became `grade.py` when 5.01 turned
# hybrid, and its `subprocess.run` now passes `check=False`. Its line
# is deleted rather than renamed - a deferral for a file that no
# longer owes anything is a lie about what is still owed.
#   B023     function-uses-loop-variable       0   (was 24, all in ONE file)
#   F811     redefined-while-unused            0   (was 1)
#
# B023 is the rule this file's history is proudest of: all 24 findings
# were one retry closure in `library/processes/edit_video/run_pipeline.py`
# closing over its loop's `impl`, `inputs` and `node_id`, and it now binds
# all three as default arguments - so B023 is enforced with NO exception
# anywhere in the repository, and F811 with it.  The first NEW hit on
# either rule fails the build instead of joining a list.
#
# What REMAINS here is fixed file by file in later commits, deliberately,
# because a lint sweep and a CI change do not belong in one diff - and a
# blanket fix for `subprocess.run` without `check=` could turn a tolerated
# failure into a crash. Each remaining line is a judgement still owed.
[lint.per-file-ignores]
