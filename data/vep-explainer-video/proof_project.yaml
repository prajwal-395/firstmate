  # supplies none of them: `explainer_plan.normalise_declaration` refuses
  # a declaration missing any one rather than filling it in.
  #
  # `colour` is the project's own Akshita accent, quoted from
  # `pipeline.speaker_subtitle_styles` above - the reel is hers.  It is
  # the project's colour, not a colour this lane picked.
  explainer:
    element: list_build      # what stages: list_build | comparison_bars | step_counter
    band: above              # above | over | below the picture the reel delivers
    anchor: bottom_left      # one of motion_graphics_plan.ANCHORS, inside the band
    hold_seconds: 3.0        # how long the finished build holds after its last stage
    colour: '#FFB8D4'
    type_role: supporting
    entrance: fade
    exit: fade
