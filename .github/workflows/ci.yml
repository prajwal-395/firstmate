name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # httpx2 backs starlette.testclient, which the dashboard API tests import
        pip install pytest ruff httpx2
        # Filter out GPU and heavy ML deps for CI
        grep -vE 'torch|sam2|whisperx' requirements.txt > ci_requirements.txt
        pip install -r ci_requirements.txt
        
    - name: Run Pytest
      run: |
        python -m pytest tests/ -v --tb=short -x
        
    - name: Compile check
      run: |
        python -m py_compile manage_project.py
        find library/steps -name "step.py" -o -name "bridge.py" | xargs -I {} python -m py_compile {}
        
    - name: Ruff Check
      run: |
        # Run ruff check, but don't fail the build if it finds issues
        ruff check library/ tests/ --output-format=github || true
