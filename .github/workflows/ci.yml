name: CI

# The full suite is DELIBERATE - once per batch, on the `run-tests`
# label - and never per push or per merge. It ran on every push to main
# as well, which re-ran 12-18 minutes against the exact tree the PR had
# just proved green, for no information at all. Measured 2026-09-05: the
# account was at 1,801 of 2,000 Actions minutes on the fifth of the
# month, and merges were a large share of it.
#
# `workflow_dispatch` stays a trigger, but no longer reaches the
# expensive jobs - see their `if:` conditions.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  path-filter:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          code_changed:
            - 'library/**'
            - 'tests/**'
            - 'requirements.txt'
            - '.github/**'
            - 'pyproject.toml'

  fast-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install fast dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: AGENTS.md size gate (FAILS THE BUILD)
      run: python scripts/check_agents_md_size.py

    - name: Compile check
      run: |
        python -m py_compile manage_project.py
        find library/steps -name "step.py" -o -name "bridge.py" | xargs -I {} python -m py_compile {}

    - name: Ruff - the classes that indicate a real defect (FAILS THE BUILD)
      if: ${{ !cancelled() }}
      run: |
        ruff check library/ tests/ --config ruff-ci-gate.toml --output-format=github

    - name: Ruff - everything else (report only)
      if: ${{ !cancelled() }}
      run: |
        ruff check library/ tests/ --output-format=github || true
        echo "--- what the report-only half found ---"
        ruff check library/ tests/ --statistics || true

  full-suite:
    needs: path-filter
    if: |
      !cancelled() &&
      needs.path-filter.outputs.code_changed != 'false' &&
      (
        github.event_name == 'pull_request' && (github.event.action == 'ready_for_review' || (github.event.action == 'labeled' && github.event.label.name == 'run-tests'))
      )
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: 'pip'
        
    - name: Report disk usage and free space
      run: |
        echo "Disk usage before freeing space:"
        df -h
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
        echo "Disk usage after freeing space:"
        df -h

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest ruff httpx2
        grep -vE 'torch|sam2|whisperx|parselmouth' requirements.txt > ci_requirements.txt
        pip install -r ci_requirements.txt

    - name: Install ffmpeg
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends ffmpeg
        ffmpeg -version | head -1
        ffprobe -version | head -1
        
    - name: Run Pytest
      run: |
        python -m pytest tests/ -m "not heavy_ml" -rs --tb=short
    - name: Report disk usage (after install)
      if: always()
      run: |
        echo "Disk usage after dependency installation:"
        df -h

  heavy-ml-suite:
    needs: path-filter
    if: |
      !cancelled() &&
      needs.path-filter.outputs.code_changed != 'false' &&
      (
        github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-heavy-ml'
      )
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Report disk usage and free space
      run: |
        echo "Disk usage before freeing space:"
        df -h
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
        echo "Disk usage after freeing space:"
        df -h

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest ruff httpx2
        pip install -r requirements.txt

    - name: Install ffmpeg and espeak
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends ffmpeg espeak
        ffmpeg -version | head -1
        espeak --version | head -1
        
    - name: Run Pytest
      run: |
        python -m pytest tests/ -m heavy_ml -rs --tb=short

    - name: Report disk usage (after install)
      if: always()
      run: |
        echo "Disk usage after dependency installation:"
        df -h
