<!doctype html>
<!--
  MotionGraphics - HyperFrames port of remotion-subtitles/src/compositions/MotionGraphics.

  The PLAN owns the look (which of the eighteen roster arms, its copy,
  colour, anchor, row, footprint and timing); this file owns what each
  arm LOOKS like, with the same numbers: RAMP_FRAMES, TYPE_SIZE/WEIGHT,
  STACK_GAP_PX, LINE_HEIGHT 1.3, REVIEW_PANEL, STAR_PATH, the staged
  5-frame stagger, list/comparison stagger math, the cubic ease-outs and
  the progress-bar lerp. A number that means something else here than
  there is two drawings of one name.

  Declarative tweens only: GSAP seek() suppresses callbacks, so nothing
  draws in an onUpdate. Each element is the engine's own .clip windowed
  to its [startFrame, startFrame+durationFrames); stacks lay out only
  what the engine shows, the way the Remotion side filters isLive per
  frame. Per-frame-computed content (typewriter reveals, counter
  figures, digit strips) is evaluated AT BUILD TIME off the same
  formulas and baked into layers or per-frame tweens - values, never
  callbacks. The digit-strip spring curve is sampled from Remotion's
  own spring() at stage time (hyperframes_render bakes
  data._hf_digit_offsets), so the physics is the dependency's, not a
  second spelling of it.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__REN_WIDTH__, height=__REN_HEIGHT__" />
    <script src="./gsap.min.js"></script>
    <style>
      <!--__REN_HEAD_EXTRA__-->
      @font-face {
        font-family: "Montserrat";
        src: url("./Montserrat-Variable.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: __REN_WIDTH__px; height: __REN_HEIGHT__px;
        overflow: hidden; background: transparent;
      }
      #root {
        position: relative; width: 100%; height: 100%;
        overflow: hidden; font-family: Montserrat, sans-serif;
        pointer-events: none;
      }
      .stack { position: absolute; display: flex; }
      .el { position: relative; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="__REN_DURATION__"
      data-width="__REN_WIDTH__"
      data-height="__REN_HEIGHT__"
      data-fps="__REN_FPS__"
    ></div>
    <script>
      //__REN_PROPS__
      (function () {
        var P = window.__REN_PROPS || {};
        var FPS = Number(P.fps) || 30;
        var W = Number(P.width) || 1080;
        var H = Number(P.height) || 1920;
        var D = Number(P.durationInFrames) || 1;
        var T = D / FPS;
        var safe = P.safeArea;
        if (!safe) throw new Error("MotionGraphics HF props carry no safeArea.");
        var elements = P.elements || [];
        var layoutWidth = (P.layoutWidth === undefined || P.layoutWidth === null)
          ? null : Number(P.layoutWidth);
        var EPS = 0.001;

        var RAMP = { cut: 0, fade: 8, slide: 8, scale: 8, mask: 8, draw: 12,
                     blur: 10, typewriter: 20, glitch: 10, flip: 12 };
        var TYPE_SIZE = { display: 56, supporting: 36, micro: 24 };
        var TYPE_WEIGHT = { display: 900, supporting: 700, micro: 600 };
        var REVIEW_PANEL = { width: 660, pad: 26, radius: 20, rule: 2,
          nameSize: 34, nameLine: 1.25, nameToScore: 12, scoreSize: 30,
          scoreLine: 1.2, scoreGap: 10, headerStar: 26, labelSize: 24,
          scoreToRows: 20, rowPadY: 18, avatar: 46, avatarLetter: 22,
          avatarGap: 16, authorSize: 26, authorLine: 1.2, authorToBody: 8,
          rowStar: 20, whenSize: 22, bodySize: 26, bodyLine: 1.35,
          nameWeight: 600, scoreWeight: 700, labelWeight: 500,
          authorWeight: 600, whenWeight: 500, bodyWeight: 400, bodyLines: 2 };
        var STAR_PATH = "M12 2.1l3.06 6.2 6.84 1-4.95 4.82 1.17 6.81L12 17.72 " +
          "5.88 20.93l1.17-6.81L2.1 9.3l6.84-1z";
        var STAGE_STAGGER = 5, STAGED_PARTS = 3;
        var SELF_POSITIONING = { progress_bar: 1, frame_accents: 1 };

        function sizeOf(role) { return TYPE_SIZE[role] || TYPE_SIZE.supporting; }
        function weightOf(role) { return TYPE_WEIGHT[role] || TYPE_WEIGHT.supporting; }
        function runStyle(role, scale, color) {
          return { fontSize: (sizeOf(role) * scale) + "px",
            fontWeight: weightOf(role), color: color,
            textShadow: "0px 4px 12px rgba(0,0,0,0.6)", lineHeight: "1.1",
            letterSpacing: role === "display" ? "3px" : "0px",
            textTransform: role === "display" ? "uppercase" : "none" };
        }
        function applyRunStyle(el, role, scale, color) {
          var s = runStyle(role, scale, color);
          for (var k in s) el.style[k] = s[k];
        }
        function rampOf(ch) { return RAMP[ch] || 0; }
        function clamp01(v) { return Math.min(1, Math.max(0, v)); }
        function easeOutCubic(p) { return 1 - Math.pow(1 - clamp01(p), 3); }

        // typewriterShown: the entrance reveals, the exit conceals, the
        // exit winning where they overlap. Shared with FullFrameCard.
        function typeShown(lf, dur, entrance, exit) {
          var out = exit === "typewriter" ? rampOf(exit) : 0;
          if (out > 0 && dur - lf < out)
            return clamp01((dur - lf) / out);
          if (entrance !== "typewriter") return 1;
          var inf = rampOf(entrance);
          if (inf <= 0) return 1;
          return clamp01(lf / inf);
        }
        function isTypewriting(lf, dur, entrance, exit) {
          return (entrance === "typewriter" || exit === "typewriter") &&
            typeShown(lf, dur, entrance, exit) < 1;
        }
        function typeSplit(lengths, progress) {
          var total = lengths.reduce(function (s, n) { return s + n; }, 0);
          var remaining = Math.round(total * clamp01(progress));
          var shown = [], cursor = -1;
          for (var i = 0; i < lengths.length; i += 1) {
            var take = Math.min(lengths[i], Math.max(0, remaining));
            shown.push(take); remaining -= take;
            if (cursor === -1 && progress < 1 && take < lengths[i]) cursor = i;
          }
          return { shown: shown, cursorRun: cursor };
        }
        function cursorOn(progress) { return Math.floor(progress * 30) % 2 === 0; }

        // stagedBuild: parts arrive in order on the entrance, stagger
        // apart, and leave in reverse on the exit.
        function stagedBuild(lf, dur, entrance, exit, part) {
          var inf = rampOf(entrance), outf = rampOf(exit);
          var arriving = inf > 0 ? clamp01((lf - part * STAGE_STAGGER) / inf)
            : (lf >= part * STAGE_STAGGER ? 1 : 0);
          var outStart = (STAGED_PARTS - 1 - part) * STAGE_STAGGER;
          var fromEnd = dur - lf;
          var leaving = outf > 0 ? clamp01((fromEnd - outStart) / outf)
            : (fromEnd > outStart ? 1 : 0);
          return Math.min(arriving, leaving);
        }
        // stageStarts: the plan's own per-stage seconds where stated,
        // an equal share of the hold where not.
        function stageStarts(el, count) {
          var hold = Math.max(1, el.durationFrames - rampOf(el.exit));
          var raw = (el.data || {}).stage_offsets;
          var offsets = Array.isArray(raw) ? raw : [];
          if (offsets.length >= count && count > 0) {
            var starts = [], prev = 0;
            for (var i = 0; i < count; i += 1) {
              var f = Math.round(Math.max(0, Number(offsets[i]) || 0) * FPS);
              var c = Math.max(prev, Math.min(f, hold - 1));
              starts.push(c); prev = c;
            }
            // The reveal takes the element's own entrance ramp, never the
            // gap to the next stage - and `??`, not `||`: a `cut`
            // entrance ramps over 0 frames, and an OR would read that 0
            // as absent and hand it fade's 8. Same operator the Remotion
            // side reads, so the same entrance means the same window.
            var ramp = (el.entrance in RAMP) ? RAMP[el.entrance] : RAMP.fade;
            var window = Math.max(1, ramp);
            return { starts: starts, window: window };
          }
          var interval = hold / Math.max(1, count);
          var eq = [];
          for (var j = 0; j < count; j += 1) eq.push(Math.round(j * interval));
          return { starts: eq, window: interval };
        }

        function anchorParts(anchor) {
          switch (anchor) {
            case "top_left": return ["top", "left"];
            case "top_centre": return ["top", "centre"];
            case "top_right": return ["top", "right"];
            case "middle_left": return ["middle", "left"];
            case "middle_right": return ["middle", "right"];
            case "bottom_left": return ["bottom", "left"];
            case "bottom_centre": return ["bottom", "centre"];
            case "bottom_right": return ["bottom", "right"];
            case "centre": return ["middle", "centre"];
            default: return ["middle", "centre"];
          }
        }
        function safeUsable() { return Math.max(0, W - safe.left - safe.right); }

        var root = document.getElementById("root");
        var tl = gsap.timeline({ paused: true });

        // One element's opacity + entrance/exit onto its container.
        // Linear ramps, the way interpolate reads without an easing;
        // the exit spread last so it wins where they overlap.
        function motionTweens(box, el, t0) {
          var dur = el.durationFrames, inf = rampOf(el.entrance), outf = rampOf(el.exit);
          var T_IN = inf / FPS, T_OUT = outf / FPS, TT = dur / FPS;
          if (inf > 0)
            tl.fromTo(box, { opacity: 0 }, { opacity: 1, duration: T_IN, ease: "none" }, t0);
          if (outf > 0)
            tl.to(box, { opacity: 0, duration: T_OUT, ease: "none" },
              Math.max(t0, t0 + TT - T_OUT));
          var e = el.entrance;
          if (inf > 0 && T_IN > 0) {
            var d = { duration: T_IN, ease: "none" };
            if (e === "slide") tl.fromTo(box, { y: 40 }, Object.assign({ y: 0 }, d), t0);
            else if (e === "scale") tl.fromTo(box, { scale: 0.7 }, Object.assign({ scale: 1 }, d), t0);
            else if (e === "mask") tl.fromTo(box, { clipPath: "inset(0 100% 0 0)" },
              Object.assign({ clipPath: "inset(0 0% 0 0)" }, d), t0);
            else if (e === "draw") tl.fromTo(box, { scale: 0.85, filter: "blur(4px)" },
              Object.assign({ scale: 1, filter: "blur(0px)" }, d), t0);
            else if (e === "blur") tl.fromTo(box, { filter: "blur(8px)", y: 12 },
              Object.assign({ filter: "blur(0px)", y: 0 }, d), t0);
            else if (e === "flip") tl.fromTo(box, { rotationY: 90, transformPerspective: 900 },
              Object.assign({ rotationY: 0 }, d), t0);
            else if (e === "glitch") {
              tl.fromTo(box, { x: 0 }, { x: 6, duration: T_IN / 4, ease: "none" }, t0);
              tl.to(box, { x: -4, duration: T_IN / 4, ease: "none" }, t0 + T_IN / 4);
              tl.to(box, { x: 2, duration: T_IN / 4, ease: "none" }, t0 + T_IN / 2);
              tl.to(box, { x: 0, duration: T_IN / 4, ease: "none" }, t0 + (3 * T_IN) / 4);
              tl.fromTo(box,
                { filter: "drop-shadow(6px 0 rgba(255,0,0,0.7)) drop-shadow(-6px 0 rgba(0,255,255,0.7)) drop-shadow(0 3px rgba(0,255,0,0.5))" },
                Object.assign({ filter: "drop-shadow(0px 0 rgba(255,0,0,0)) drop-shadow(0px 0 rgba(0,255,255,0)) drop-shadow(0 0px rgba(0,255,0,0))" }, d), t0);
            }
          }
          var x = el.exit, t1 = Math.max(t0, t0 + TT - T_OUT);
          if (outf > 0 && T_OUT > 0) {
            var d2 = { duration: T_OUT, ease: "none" };
            if (x === "slide") tl.to(box, Object.assign({ y: -40 }, d2), t1);
            else if (x === "scale") tl.to(box, Object.assign({ scale: 0.7 }, d2), t1);
            else if (x === "mask") tl.to(box, Object.assign({ clipPath: "inset(0 0 0 100%)" }, d2), t1);
            else if (x === "draw") tl.to(box, Object.assign({ scale: 0.85, filter: "blur(4px)" }, d2), t1);
            else if (x === "blur") tl.to(box, Object.assign({ filter: "blur(8px)", y: -12 }, d2), t1);
            else if (x === "flip") tl.to(box, Object.assign({ rotationY: -90, transformPerspective: 900 }, d2), t1);
            else if (x === "glitch") {
              tl.to(box, { x: 5, duration: T_OUT / 3, ease: "none" }, t1);
              tl.to(box, { x: -3, duration: T_OUT / 3, ease: "none" }, t1 + T_OUT / 3);
              tl.to(box, { x: 0, duration: T_OUT / 3, ease: "none" }, t1 + (2 * T_OUT) / 3);
            }
          }
        }

        // Runs or typewriter layers into a parent, off a per-frame
        // reveal function. States are grouped at build time so the
        // reveal steps on the same frames both engines read.
        function textLayers(parent, el, scale, revealAt) {
          var lengths = el.runs.map(function (r) { return r.text.length; });
          var states = [], lastKey = null;
          for (var f = 0; f < el.durationFrames; f += 1) {
            var prog = revealAt(f);
            var sp = typeSplit(lengths, prog);
            var key = sp.shown.join(",") + "|" + (prog < 1 ? sp.cursorRun : -1) +
              "|" + (cursorOn(prog) ? 1 : 0);
            if (key !== lastKey) { states.push({ f0: f, sp: sp, prog: prog }); lastKey = key; }
          }
          states.forEach(function (st, i) {
            var f1 = (i + 1 < states.length) ? states[i + 1].f0 : el.durationFrames;
            var layer = document.createElement("div");
            layer.className = "clip";
            layer.setAttribute("data-start", ((el.startFrame + st.f0) / FPS).toFixed(6));
            layer.setAttribute("data-duration", ((f1 - st.f0) / FPS).toFixed(6));
            el.runs.forEach(function (run, ri) {
              var vis = (run.text || "").slice(0, st.sp.shown[ri]);
              if (!vis.length && st.sp.cursorRun !== ri) return;
              var div = document.createElement("div");
              div.style.fontSize = (sizeOf(run.type_role) * scale) + "px";
              div.style.fontWeight = weightOf(run.type_role);
              div.style.color = el.color;
              div.style.textShadow = "0px 4px 12px rgba(0,0,0,0.6)";
              div.style.lineHeight = "1.1";
              div.style.letterSpacing = run.type_role === "display" ? "3px" : "0px";
              div.style.textTransform = run.type_role === "display" ? "uppercase" : "none";
              div.textContent = vis;
              if (st.sp.cursorRun === ri) {
                var cur = document.createElement("span");
                cur.textContent = "|";
                cur.style.opacity = cursorOn(st.prog) ? "1" : "0";
                div.appendChild(cur);
              }
              layer.appendChild(div);
            });
            parent.appendChild(layer);
          });
        }
        function runsInto(parent, el, scale) {
          el.runs.forEach(function (run) {
            var div = document.createElement("div");
            applyRunStyle(div, run.type_role, scale, el.color);
            div.textContent = run.text;
            parent.appendChild(div);
          });
        }
        // TextContent: typewriter layers where a reveal is mid-flight,
        // whole runs everywhere else.
        function textInto(parent, el, scale) {
          var tw = isTypewriting(0, el.durationFrames, el.entrance, el.exit) ||
            el.entrance === "typewriter" || el.exit === "typewriter";
          if (tw && el.runs.length) {
            textLayers(parent, el, scale, function (lf) {
              return typeShown(lf, el.durationFrames, el.entrance, el.exit);
            });
          } else {
            runsInto(parent, el, scale);
          }
        }

        function starRow(parent, value, size, star, muted) {
          var row = document.createElement("span");
          row.style.display = "flex"; row.style.flex = "0 0 auto";
          for (var i = 0; i < 5; i += 1) {
            var filled = Math.max(0, Math.min(1, value - i));
            var cell = document.createElement("span");
            cell.style.position = "relative";
            cell.style.width = size + "px"; cell.style.height = size + "px";
            var NS = "http://www.w3.org/2000/svg";
            var svg = document.createElementNS(NS, "svg");
            svg.setAttribute("width", size); svg.setAttribute("height", size);
            svg.setAttribute("viewBox", "0 0 24 24"); svg.style.display = "block";
            var path = document.createElementNS(NS, "path");
            path.setAttribute("d", STAR_PATH); path.setAttribute("fill", muted);
            svg.appendChild(path); cell.appendChild(svg);
            if (filled > 0) {
              var over = document.createElement("span");
              over.style.position = "absolute"; over.style.top = "0"; over.style.left = "0";
              over.style.width = (size * filled) + "px"; over.style.height = size + "px";
              over.style.overflow = "hidden";
              var svg2 = document.createElementNS(NS, "svg");
              svg2.setAttribute("width", size); svg2.setAttribute("height", size);
              svg2.setAttribute("viewBox", "0 0 24 24"); svg2.style.display = "block";
              var path2 = document.createElementNS(NS, "path");
              path2.setAttribute("d", STAR_PATH); path2.setAttribute("fill", star);
              svg2.appendChild(path2); over.appendChild(svg2); cell.appendChild(over);
            }
            row.appendChild(cell);
          }
          parent.appendChild(row);
        }

        // ── element arms ──

        function armStagedLowerThird(el, scale, host) {
          var alignRight = String(el.anchor).substr(-5) === "right";
          var runs = el.runs || [];
          if (!runs.length) return;
          var nameRun = runs[0], titleRun = runs[1];
          var displaySize = sizeOf("display") * scale;
          var ruleThickness = Math.max(2, Math.round(displaySize / 12));
          var ruleGap = Math.max(2, Math.round(displaySize / 7));
          var wrap = document.createElement("div");
          wrap.style.display = "flex"; wrap.style.flexDirection = "column";
          wrap.style.alignItems = alignRight ? "flex-end" : "flex-start";
          var inf = rampOf(el.entrance), outf = rampOf(el.exit);
          var t0 = el.startFrame / FPS, TT = el.durationFrames / FPS;
          // Part 1: the name rises out from behind the rule, clipped.
          // Built first so the column order is name, rule, title.
          var nameBox = document.createElement("div");
          nameBox.style.overflow = "hidden";
          var nameDiv = document.createElement("div");
          applyRunStyle(nameDiv, nameRun.type_role, scale, el.color);
          nameDiv.textContent = nameRun.text;
          nameBox.appendChild(nameDiv);
          wrap.appendChild(nameBox);
          // Part 0: the rule draws out from the aligned edge.
          var rule = document.createElement("div");
          rule.style.marginTop = ruleGap + "px"; rule.style.height = ruleThickness + "px";
          rule.style.alignSelf = "stretch"; rule.style.backgroundColor = el.color;
          rule.style.transformOrigin = alignRight ? "right center" : "left center";
          wrap.appendChild(rule);
          if (inf > 0)
            tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: inf / FPS, ease: "none" }, t0);
          if (outf > 0) {
            var ro = (STAGED_PARTS - 1 - 0) * STAGE_STAGGER / FPS;
            tl.to(rule, { scaleX: 0, duration: outf / FPS, ease: "none" },
              Math.max(t0, t0 + TT - ro - outf / FPS));
          }
          host.appendChild(wrap);
          var nIn = 1 * STAGE_STAGGER, nOut = (STAGED_PARTS - 1 - 1) * STAGE_STAGGER;
          if (inf > 0) {
            tl.fromTo(nameBox, { clipPath: "inset(100% 0 0 0)", y: displaySize * 0.35 },
              { clipPath: "inset(0% 0 0 0)", y: 0, duration: inf / FPS, ease: "none" },
              t0 + nIn / FPS);
          }
          if (outf > 0) {
            tl.to(nameBox, { clipPath: "inset(100% 0 0 0)", y: displaySize * 0.35,
              duration: outf / FPS, ease: "none" },
              Math.max(t0, t0 + TT - nOut / FPS - outf / FPS));
          }
          // Part 2: the title wipes out along the rule.
          if (titleRun) {
            var titleBox = document.createElement("div");
            titleBox.style.marginTop = ruleGap + "px";
            var titleDiv = document.createElement("div");
            applyRunStyle(titleDiv, titleRun.type_role, scale, el.color);
            titleDiv.textContent = titleRun.text;
            titleBox.appendChild(titleDiv);
            wrap.appendChild(titleBox);
            var wipe0 = alignRight ? "inset(0 0 0 100%)" : "inset(0 100% 0 0)";
            var wipe1 = "inset(0 0% 0 0)";
            if (alignRight) wipe1 = "inset(0 0 0 0%)";
            var tIn = 2 * STAGE_STAGGER, tOut = (STAGED_PARTS - 1 - 2) * STAGE_STAGGER;
            if (inf > 0)
              tl.fromTo(titleBox, { clipPath: wipe0 },
                { clipPath: wipe1, duration: inf / FPS, ease: "none" }, t0 + tIn / FPS);
            if (outf > 0)
              tl.to(titleBox, { clipPath: wipe0, duration: outf / FPS, ease: "none" },
                Math.max(t0, t0 + TT - tOut / FPS - outf / FPS));
          }
          host.appendChild(wrap);
        }

        function armDigitRoll(el, scale, host, value, fontSize) {
          var data = el.data || {};
          var baked = data._hf_digit_offsets;
          // Baked at stage time from Remotion's own spring(): one
          // y-offset per digit per local frame. Absent means the stage
          // refused the bake - drawing an unbaked roll would be a
          // second, silent physics.
          if (!baked) throw new Error("digit_counter HF props carry no baked spring offsets.");
          var digits = String(value).split("");
          var digitHeight = fontSize * 1.2;
          var strip = document.createElement("div");
          strip.style.display = "flex"; strip.style.alignItems = "center";
          strip.style.overflow = "hidden"; strip.style.height = digitHeight + "px";
          var t0 = el.startFrame / FPS;
          digits.forEach(function (char, i) {
            var digitVal = parseInt(char, 10);
            if (isNaN(digitVal)) {
              var stat = document.createElement("span");
              stat.style.fontSize = fontSize + "px"; stat.style.fontWeight = "900";
              stat.style.color = el.color; stat.style.lineHeight = "1.2";
              stat.style.fontVariantNumeric = "tabular-nums";
              stat.textContent = char;
              strip.appendChild(stat);
              return;
            }
            var cell = document.createElement("div");
            cell.style.width = (fontSize * 0.65) + "px";
            cell.style.height = digitHeight + "px";
            cell.style.overflow = "hidden"; cell.style.position = "relative";
            var rail = document.createElement("div");
            rail.style.position = "absolute"; rail.style.top = "0"; rail.style.left = "0";
            for (var d = 0; d < 10; d += 1) {
              var dd = document.createElement("div");
              dd.style.fontSize = fontSize + "px"; dd.style.fontWeight = "900";
              dd.style.color = el.color; dd.style.lineHeight = "1.2";
              dd.style.height = digitHeight + "px"; dd.style.display = "flex";
              dd.style.alignItems = "center"; dd.style.justifyContent = "center";
              dd.style.fontVariantNumeric = "tabular-nums";
              dd.textContent = String(d);
              rail.appendChild(dd);
            }
            cell.appendChild(rail); strip.appendChild(cell);
            var samples = baked[i];
            if (!samples) throw new Error("digit_counter bake is short a digit.");
            // The baseline lives in the DOM, not in a set(): every
            // per-frame .to() below starts from the value the build
            // left, so a seek lands on values rather than on a callback.
            rail.style.transform = "translateY(" + (samples[0] * digitHeight) + "px)";
            for (var f = 0; f + 1 < samples.length && f + 1 < el.durationFrames; f += 1) {
              tl.to(rail, { y: samples[f + 1] * digitHeight, duration: 1 / FPS, ease: "none" },
                t0 + f / FPS);
            }
          });
          host.appendChild(strip);
        }

        function buildElement(el) {
          var scale = (el.footprint && el.footprint > 0) ? el.footprint : 1;
          var box = document.createElement("div");
          box.className = "el clip";
          box.setAttribute("data-start", (el.startFrame / FPS).toFixed(6));
          box.setAttribute("data-duration", (el.durationFrames / FPS).toFixed(6));

              track.style.height = Math.round(12 * scale) + "px";
              track.style.backgroundColor = "rgba(255, 255, 255, 0.1)";
              track.style.borderRadius = Math.round(6 * scale) + "px";
              track.style.overflow = "hidden";
              var fill = document.createElement("div");
              fill.style.height = "100%";
              fill.style.backgroundColor = el.color;
              fill.style.borderRadius = Math.round(6 * scale) + "px";
              fill.style.boxShadow = "0 0 12px " + el.color + "60";
              track.appendChild(fill);
              wrap.appendChild(track);
              box.appendChild(wrap);
              var win = Math.max(1, st.window * 0.7) / FPS;
              var target = (values[i] / maxValue) * 100;
              tl.fromTo(wrap, { opacity: 0 }, { opacity: 1, duration: win, ease: "power2.out" },
                t0 + st.starts[i] / FPS);
              tl.fromTo(fill, { width: "0%" }, { width: target + "%", duration: win, ease: "power2.out" },
                t0 + st.starts[i] / FPS);
            })(i);
          }
        }

        function buildStepCounter(el, scale, box) {
          var data = el.data || {};
          var position = (typeof data.position === "number") ? data.position : 1;
          var total = (typeof data.total === "number") ? data.total : 1;
          box.style.display = "flex"; box.style.flexDirection = "column";
          box.style.alignItems = "center";
          box.style.gap = Math.round(8 * scale) + "px";
          var row = document.createElement("div");
          row.style.display = "flex"; row.style.alignItems = "baseline";
          row.style.gap = Math.round(4 * scale) + "px";
          var pos = document.createElement("span");
          pos.style.fontSize = (sizeOf("display") * scale) + "px";
          pos.style.fontWeight = "900"; pos.style.color = el.color;
          pos.style.fontVariantNumeric = "tabular-nums";
          pos.style.textShadow = "0 0 24px " + el.color + "40, 0 4px 12px rgba(0,0,0,0.5)";
          pos.style.lineHeight = "1.0";
          pos.textContent = String(position);
          row.appendChild(pos);
          var of = document.createElement("span");
          of.style.fontSize = (sizeOf("micro") * scale) + "px";
          of.style.fontWeight = weightOf("micro"); of.style.color = el.color;
          of.style.opacity = "0.6";
          // 1.5: the same unset-`normal` the bars labels needed - the
          // Remotion side states no line-height on this span either.
          of.style.lineHeight = "1.5";
          of.style.textShadow = "0px 2px 8px rgba(0,0,0,0.4)";
          of.textContent = "of " + total;
          row.appendChild(of);
          box.appendChild(row);
          if (el.runs.length) {
            var lab = document.createElement("div");
            runsInto(lab, el, scale * 0.7);
            box.appendChild(lab);
          }
        }

        function buildWebsite(el, scale, box) {
          box.style.display = "flex"; box.style.flexDirection = "column";
          box.style.width = Math.round(safeUsable() * scale) + "px";
          box.style.borderRadius = Math.round(16 * scale) + "px";
          box.style.overflow = "hidden";
          box.style.backgroundColor = "rgba(0, 0, 0, 0.85)";
          box.style.border = Math.round(3 * scale) + "px solid " + el.color;
          box.style.boxShadow = "0 8px 32px rgba(0,0,0,0.5)";
          var address = el.runs.length ? el.runs[0].text : "";
          if (address !== "") {
            var bar = document.createElement("div");
            bar.style.padding = Math.round(10 * scale) + "px " + Math.round(16 * scale) + "px";
            bar.style.borderBottom = Math.round(3 * scale) + "px solid " + el.color;
            bar.style.whiteSpace = "nowrap"; bar.style.overflow = "hidden";
            bar.style.textOverflow = "ellipsis";
            bar.style.fontSize = (sizeOf("micro") * scale) + "px";
            bar.style.fontWeight = weightOf("micro");
            bar.style.color = "#fff";
            // 1.5: the same unset-`normal` the bars labels needed.
            bar.style.lineHeight = "1.5";
            bar.textContent = address;
            box.appendChild(bar);
          }
          var shot = document.createElement("img");
          shot.src = el.asset; shot.alt = "";
          shot.style.width = "100%"; shot.style.height = "auto";
          shot.style.objectFit = "contain"; shot.style.display = "block";
          box.appendChild(shot);
        }

        // ── layout: chrome first, then anchor stacks of live elements ──

        elements.forEach(function (el) {
          if (!SELF_POSITIONING[el.element]) return;
          var built = buildElement(el);
          if (built) root.appendChild(built);
        });

        var anchors = [];
        elements.forEach(function (el) {
          if (SELF_POSITIONING[el.element]) return;
          if (anchors.indexOf(el.anchor) < 0) anchors.push(el.anchor);
        });
        anchors.forEach(function (anchor) {
          var parts = anchorParts(anchor);
          var stack = document.createElement("div");
          stack.className = "stack";
          stack.style.gap = "24px";
          if (parts[0] === "top") {
            stack.style.top = safe.top + "px";
            stack.style.flexDirection = "column";
          } else if (parts[0] === "bottom") {
            stack.style.bottom = safe.bottom + "px";
            stack.style.flexDirection = "column-reverse";
          } else {
            stack.style.top = "50%";
            stack.style.transform = "translateY(-50%)";
            stack.style.flexDirection = "column";
          }
          stack.style.display = "flex";
          if (parts[1] === "left") {
            stack.style.left = safe.left + "px";
          } else if (parts[1] === "right") {
            stack.style.right = safe.right + "px";
            stack.style.textAlign = "right";
          } else {
            stack.style.left = safe.left + "px";
            stack.style.right = safe.right + "px";
            stack.style.textAlign = "center";
          }
          if (layoutWidth !== null && parts[1] !== "left" && parts[1] !== "right") {
            stack.style.maxWidth = Math.round(layoutWidth) + "px";
            stack.style.marginLeft = "auto";
            stack.style.marginRight = "auto";
          }
          elements
            .filter(function (el) {
              return !SELF_POSITIONING[el.element] && el.anchor === anchor;
            })
            .sort(function (a, b) { return (a.row || 0) - (b.row || 0); })
            .forEach(function (el) {
              var built = buildElement(el);
              if (built) stack.appendChild(built);
            });
          root.appendChild(stack);
        });

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
